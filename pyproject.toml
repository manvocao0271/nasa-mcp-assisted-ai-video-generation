[project]
name = "pale-blue-dot"
version = "0.1.0"
description = "Multi-agent system that turns real NASA data into AI-generated cinematic short films using Qwen models on Qwen Cloud."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=1.27.1",
    "openai>=2.41.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "streamlit>=1.45.0",
]

[dependency-groups]
dev = [
    "matplotlib>=3.11.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
nasa-mcp = "nasa_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["nasa_mcp"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "nasa_mcp/features",
]
python_files = [
    "test_*.py",
    "*_test.py",
]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
markers = [
    "live: hits real NASA APIs (skipped by default; run with `pytest -m live`)",
]
addopts = "-m 'not live'"
